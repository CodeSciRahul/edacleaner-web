# line 50 tk jo bhi pipeline code hai, woh **CI (Continuous Integration)** ke liye hai.

# Iska purpose hai ki jab bhi developer code push kare ya Pull Request create/update kare, pipeline automatically code ko validate kare. Is validation mein dependencies install karna, linting, testing aur production build check karna jaise operations perform honge.

# CI ka main objective ye verify karna hai ki developer ka code **valid, error-free aur buildable** hai aur existing application ko break nahi kar raha.

# Agar saare CI checks successfully pass ho jaate hain, to Pull Request ko merge karne ke liye eligible maana ja sakta hai, depending on the repository's branch protection rules.

# **CI ka kaam sirf code ko validate karna hai; application ko server par deploy karna CI ka part nahi hai.**

# **CI → Code ko validate/check karta hai**
#**CD → Validated code ko server/production environment par deploy karta hai**

# deployment ka main code line 52 ke baad hai.


name: EdaCleaner Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/edaCleaner/edacleaner-web
            git pull origin main
            npm ci
            npm run build
            pm2 restart edaCleanerWeb